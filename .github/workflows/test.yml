name: Tests

on:
  push:
    branches: [main, develop, claude/**]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run linter (if configured)
        run: npm run lint || echo "No linter configured, skipping"
        continue-on-error: true

      - name: Run tests
        run: npm run test:ci

      - name: Generate coverage report
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage to Codecov (optional)
        if: matrix.node-version == '22.x'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
        continue-on-error: true

  build:
    name: Test Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (with tests)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: plex-to-trakt:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production

      - name: Test Docker image health
        run: |
          docker run -d --name test-container \
            -e EXTERNAL_URL=http://localhost:3000 \
            -e PLEX_CLIENT_ID=test \
            -e PLEX_SERVER_ID=test \
            -e SESSION_SECRET=test \
            plex-to-trakt:test

          # Wait for container to start
          sleep 10

          # Check if container is running
          docker ps | grep test-container

          # Check logs for errors
          docker logs test-container

          # Cleanup
          docker stop test-container
          docker rm test-container
